name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Размер PR
  pr-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | wc -l)
          CHANGED_LINES=$(git diff --stat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tail -1 | awk '{print $4+$6}')
          
          echo "Changed files: $CHANGED_FILES"
          echo "Changed lines: $CHANGED_LINES"
          
          if [ $CHANGED_FILES -gt 50 ]; then
            echo "⚠️ Warning: PR contains $CHANGED_FILES files (recommended: < 50)"
          fi
          
          if [ $CHANGED_LINES -gt 1000 ]; then
            echo "⚠️ Warning: PR contains $CHANGED_LINES lines (recommended: < 1000)"
          fi

  # Проверка коммитов
  commit-checks:
    name: Commit Message Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          echo "Checking commit messages..."
          git log --pretty=format:"%s" ${{ github.event.pull_request.base.sha }}..${{ github.sha }} | while read msg; do
            if [ ${#msg} -gt 100 ]; then
              echo "⚠️ Warning: Commit message too long (${#msg} chars): $msg"
            fi
          done

  # Проверка зависимостей
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # Комментарий в PR
  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [pr-size, commit-checks]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate PR stats
        id: stats
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | wc -l)
          CHANGED_LINES=$(git diff --stat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tail -1 | awk '{print $4+$6}')
          COMMITS=$(git rev-list --count ${{ github.event.pull_request.base.sha }}..${{ github.sha }})
          
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "lines=$CHANGED_LINES" >> $GITHUB_OUTPUT
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const stats = {
              files: '${{ steps.stats.outputs.files }}',
              lines: '${{ steps.stats.outputs.lines }}',
              commits: '${{ steps.stats.outputs.commits }}'
            };
            
            const comment = `
            ## 📊 PR Statistics
            
            - **Files changed:** ${stats.files}
            - **Lines changed:** ${stats.lines}
            - **Commits:** ${stats.commits}
            
            ---
            
            ### ✅ Checks
            
            - CI build and tests will run automatically
            - Please ensure all checks pass before merging
            - Review the changes carefully
            
            ---
            
            *This comment is auto-generated by GitHub Actions*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

